plugins {
    id 'com.android.application'
}

configurations.all {
    resolutionStrategy {
        force 'com.squareup.okhttp3:okhttp:3.12.13'
        force 'com.squareup.okio:okio:1.17.5'
    }
}

int betaVer = 0 //如果为0则是正式版

// 用于“检查更新”的构建标记：由外部通过 -Ptag=release-20 注入。
// - debug/release 均生效
// - 默认值为 dev
def gitTag = project.hasProperty("tag") ? String.valueOf(project.property("tag")) : "dev"
def hasGitTagProp = project.hasProperty("tag")

android {

    namespace 'com.RobinNotBad.BiliClient'
    //noinspection GradleDependency
    compileSdk 33

    sourceSets {
        main{
            jniLibs.srcDirs = ['libs']
            java {
                exclude '**/GeetestUtil.java'
            }
        }
    }

    defaultConfig {
        applicationId "com.RobinNotBad.BiliClient"
        minSdk 14
        //noinspection ExpiredTargetSdkVersion
        targetSdk 26
        versionCode 20260125
        versionName "2.9.5-fix"

        // 当前 APK 对应的 release tag（用于更新判断；不依赖 versionCode/versionName）
        buildConfigField "String", "GIT_TAG", "\"${gitTag}\""

        if (betaVer) {
            versionName += "-BETA" + betaVer
        }

        multiDexEnabled true

        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters 'armeabi-v7a','x86',"mips"
        }

        resConfigs 'zh'
    }

    // （可选）当通过 -Ptag=... 构建时，生成/更新根目录 version.json，供 jsDelivr 备用源使用。
    // 注意：该 task 只负责写入文件，不会自动提交到 Git。
    // jsDelivr URL 示例：https://cdn.jsdelivr.net/gh/LoaderTime/BiliClient-Fix/version.json?t=20260315
    tasks.register("writeVersionJson") {
        // 仅当外部显式传入 -Ptag 时才写文件，避免日常开发构建污染工作区。
        onlyIf { hasGitTagProp }
        doLast {
            def outFile = rootProject.file("version.json")
            def jsonObj = [
                    tag_name    : gitTag,
                    name        : gitTag,
                    body        : "",
                    published_at: "",
                    assets      : [[
                                          name               : "app-debug.apk",
                                          browser_download_url: "https://github.com/LoaderTime/BiliClient-Fix/releases/download/${gitTag}/app-debug.apk"
                                  ]]
            ]
            outFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(jsonObj)) + "\n"
            println("[writeVersionJson] Wrote ${outFile} with tag=${gitTag}")
        }
    }

    // 让 build/assemble 等任务在 -Ptag 时自动生成 version.json
    afterEvaluate {
        def wvj = tasks.findByName("writeVersionJson")
        if (wvj != null) {
            tasks.matching { it.name == "preBuild" }.configureEach {
                dependsOn(wvj)
            }
        }
    }

    signingConfigs {
        release {
            def localProps = project.rootProject.file("local.properties")
            if (localProps.exists() && new Properties() {{
                load(localProps.newDataInputStream())
            }}.hasProperty("KEY_PATH")) {
                storeFile file(pro.getProperty("KEY_PATH") != null ? pro.getProperty("KEY_PATH") : "key.jks")
                storePassword pro.getProperty("KEY_PASSWORD")
                keyAlias pro.getProperty("ALIAS_NAME")
                keyPassword pro.getProperty("ALIAS_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            buildConfigField "boolean", "BETA", String.valueOf(betaVer > 0)
            buildConfigField "boolean", "LOG_DEBUG", "true"
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def localProps = project.rootProject.file("local.properties")
            if (localProps.exists() && new Properties() {{
                load(localProps.newDataInputStream())
            }}.hasProperty("KEY_PATH")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            buildConfigField "boolean", "BETA", String.valueOf(betaVer > 0)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_9
        targetCompatibility JavaVersion.VERSION_1_9
    }

    packagingOptions {
        exclude 'META-INF/androidx.cardview_cardview.version'
    }
    buildFeatures {
        viewBinding false
    }
}

dependencies {
    //noinspection GradleDependency
    implementation 'com.google.zxing:core:3.3.0'
    //noinspection GradleDependency
    implementation 'androidx.appcompat:appcompat:1.5.1'
    //noinspection GradleDependency
    implementation 'com.google.android.material:material:1.9.0'
    //noinspection GradleDependency
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'com.squareup.okio:okio:1.17.5'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.github.bumptech.glide:glide:4.13.2'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.13.2'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.13.2'
    //noinspection GradleDependency
    implementation 'org.jsoup:jsoup:1.10.2'
    //noinspection GradleCompatible
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'org.greenrobot:eventbus:3.2.0'
    // Geetest（目前没用到）
    //implementation 'com.geetest.sensebot:sensebot:4.4.2.1'
    //danmaku
    //implementation 'com.github.ctiao:DanmakuFlameMaster:0.9.25'
    //implementation 'com.github.ctiao:ndkbitmap-armv7a:0.9.21'
    //implementation 'com.github.ctiao:ndkbitmap-x86:0.9.21'
    //ijk
    implementation project(path: ':ijkplayer-java')
    implementation project(path: ':DanmakuFlameMaster')
    implementation project(path: ':brotlij')
    implementation 'androidx.asynclayoutinflater:asynclayoutinflater:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    def multidex_version = "2.0.1"
    implementation "androidx.multidex:multidex:$multidex_version"
    implementation "org.brotli:dec:0.1.2"
    implementation "com.aayushatharva.brotli4j:brotli4j:1.16.0"
    implementation 'com.google.protobuf:protobuf-javalite:3.21.12'
}